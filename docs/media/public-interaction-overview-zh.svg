<text x="400" y="424" font-size="21" fill="#7f3427">执行记录为后续语境提供依据</text>
<text x="36" y="478" font-size="19" fill="#62594e">完整服务链仍在开发。本图不包含评估方法细节或研究结果。</text>
</g></svg>
