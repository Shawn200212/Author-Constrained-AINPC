<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1510" viewBox="0 0 1680 1510" role="img" aria-labelledby="title desc" xml:lang="zh"><title id="title">行动如何被提出、检查与执行</title><desc id="desc">场景语境进入模型提议。作者约束可以接受提议、保留原意调整后重查、要求新提议或明确不执行。UE 复核现场状态并确认执行结果，实际世界结果更新情境，独立记录只供事后复核。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#a33c2c"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#686052"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#82786a"/></marker></defs><rect width="1680" height="1510" rx="24" fill="#f2ede3"/><g font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="60" y="63" font-size="44" fill="#28231d" font-weight="700">行动如何被提出、检查与执行</text>
<text x="60" y="105" font-size="24" fill="#62594e" font-weight="400">双层架构 · 作者约束 · 世界反馈</text>
<g id="author" data-node="true"><rect x="1030" y="150" width="590" height="180" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="1060" y="185" font-size="21" fill="#62594e" font-weight="400">独立输入 · 参与检查</text><text x="1060" y="228" font-size="34" fill="#28231d" font-weight="700">作者设定与现场条件</text><text x="1060" y="272" font-size="28" fill="#28231d" font-weight="400">角色职责、目标与行动顺序</text><text x="1060" y="311" font-size="28" fill="#28231d" font-weight="400">对象、占用与交互许可</text></g>
<g id="context" data-node="true"><rect x="60" y="380" width="360" height="230" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="86" y="416" font-size="21" fill="#62594e" font-weight="400">经过整理的输入</text><text x="86" y="459" font-size="34" fill="#28231d" font-weight="700">场景语境</text><text x="86" y="506" font-size="27" fill="#28231d" font-weight="400">角色与当前任务</text><text x="86" y="545" font-size="27" fill="#28231d" font-weight="400">对话与可用对象</text><text x="86" y="584" font-size="27" fill="#28231d" font-weight="400">当前世界状态</text></g>
<g id="model" data-node="true"><rect x="490" y="365" width="450" height="310" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="518" y="401" font-size="21" fill="#62594e" font-weight="400">上层 · 在决策时提出</text><text x="518" y="447" font-size="34" fill="#28231d" font-weight="700">语言模型</text><text x="518" y="490" font-size="28" fill="#28231d" font-weight="400">根据情境提出下一步行动</text><text x="518" y="538" font-size="24" fill="#62594e" font-weight="400">结构化提议 · JSON</text><text x="518" y="577" font-size="28" fill="#28231d" font-weight="400">台词 · 意图</text><text x="518" y="612" font-size="28" fill="#28231d" font-weight="400">高层动作 · 目标引用</text><text x="518" y="650" font-size="24" fill="#62594e" font-weight="400">模型不直接改变世界。</text></g>
<g id="gate" data-node="true"><rect x="1030" y="380" width="590" height="260" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="1060" y="427" font-size="34" fill="#28231d" font-weight="700">作者约束检查</text><text x="1060" y="472" font-size="28" fill="#28231d" font-weight="400">这项提议是否符合作者边界</text><text x="1060" y="509" font-size="28" fill="#28231d" font-weight="400">与当前情境？</text><path d="M1060 533H1590" stroke="#d0c5b7" stroke-width="2"/><text x="1060" y="577" font-size="27" fill="#28231d" font-weight="400">可调整：保留原意，</text><text x="1060" y="614" font-size="27" fill="#28231d" font-weight="400">本地修改后再次检查。</text></g>
<g id="replan" data-node="true"><rect x="490" y="735" width="450" height="140" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="518" y="770" font-size="20" fill="#62594e" font-weight="400">检查后需要新提议</text><text x="518" y="815" font-size="32" fill="#28231d" font-weight="700">返回上层重新规划</text><text x="518" y="854" font-size="26" fill="#28231d" font-weight="400">新的提议仍须经过相同检查。</text></g>
<g id="stop" data-node="true"><rect x="490" y="1000" width="450" height="140" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="518" y="1035" font-size="20" fill="#62594e" font-weight="400">检查后无法继续</text><text x="518" y="1080" font-size="32" fill="#28231d" font-weight="700">明确不执行</text><text x="518" y="1119" font-size="26" fill="#28231d" font-weight="400">结束本次尝试，并记录原因。</text></g>
<g id="execute" data-node="true"><rect x="1030" y="900" width="590" height="270" rx="16" fill="#faf8f1" stroke="#b9aa96" stroke-width="2"/><text x="1060" y="936" font-size="21" fill="#62594e" font-weight="400">下层 · 保留执行权</text><text x="1060" y="980" font-size="34" fill="#28231d" font-weight="700">Unreal Engine</text><text x="1060" y="1023" font-size="28" fill="#28231d" font-weight="400">执行前复核现场状态与资源</text><text x="1060" y="1062" font-size="28" fill="#28231d" font-weight="400">调度原生任务、身体动作与交互</text><path d="M1060 1080H1590" stroke="#d0c5b7" stroke-width="2"/><text x="1060" y="1117" font-size="30" fill="#28231d" font-weight="700">由世界状态确认完成</text><text x="1060" y="1152" font-size="26" fill="#28231d" font-weight="400">未完成：回退或明确结束</text></g>
<g id="record" data-node="true"><rect x="1030" y="1260" width="590" height="170" rx="16" fill="#eae3d7" stroke="#b9aa96" stroke-width="2"/><text x="1060" y="1308" font-size="32" fill="#28231d" font-weight="700">独立记录 · 只读复核</text><text x="1060" y="1352" font-size="26" fill="#28231d" font-weight="400">模型提议 · 检查决定 · 执行结果</text><text x="1060" y="1394" font-size="26" fill="#62594e" font-weight="400">供事后复核，不参与动作选择。</text></g>
<path data-connector="context-model" d="M420 495H490" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="model-gate" d="M940 495H1030" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="author-gate" d="M1325 330V380" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="author-execute" d="M1620 235H1660V850H1510V900" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="gate-replan" d="M1030 585H980V710H715V735" fill="none" stroke="#686052" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#b)"/>
<path data-connector="replan-model" d="M490 800H450V570H490" fill="none" stroke="#686052" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#b)"/>
<path data-connector="gate-stop" d="M1030 625H1000V1065H940" fill="none" stroke="#686052" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#b)"/>
<path data-connector="gate-execute" d="M1325 640V900" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="world-context" d="M1240 1170V1220H240V610" fill="none" stroke="#a33c2c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a)"/>
<path data-connector="execute-record" d="M1510 1170V1260" fill="none" stroke="#82786a" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="3 7" marker-end="url(#c)"/>
<text x="1360" y="777" font-size="26" fill="#7f3427" font-weight="400">通过检查</text>
<text x="1450" y="835" font-size="24" fill="#7f3427" font-weight="400">现场状态复核</text>
<text x="400" y="1200" font-size="28" fill="#7f3427" font-weight="400">已确认的世界结果 → 更新下一轮情境</text>
<text x="60" y="1293" font-size="27" fill="#62594e" font-weight="400">作者约束是职责边界，不是第三个大脑。</text>
<text x="60" y="1331" font-size="27" fill="#62594e" font-weight="400">JSON 只标示信息类别，不展示真实字段。</text>
<text x="60" y="1369" font-size="27" fill="#62594e" font-weight="400">具体作者规则与修复算法暂不公开。</text>
<path d="M60 1410h35" stroke="#a33c2c" stroke-width="3.5" />
<text x="105" y="1418" font-size="21" fill="#62594e" font-weight="400">行动与世界反馈</text>
<path d="M410 1410h35" stroke="#686052" stroke-width="3.5" stroke-dasharray="8 6"/>
<text x="455" y="1418" font-size="21" fill="#62594e" font-weight="400">重新规划或停止</text>
<path d="M735 1410h35" stroke="#82786a" stroke-width="3.5" stroke-dasharray="3 6"/>
<text x="780" y="1418" font-size="21" fill="#62594e" font-weight="400">单向记录</text>
<text x="60" y="1477" font-size="25" fill="#62594e" font-weight="400">设计概览，部分路径仍在开发；具体协议与评估细节暂不公开。</text>
</g></svg>
