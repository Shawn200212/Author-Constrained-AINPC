<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">AINPC conceptual responsibilities</title>
<desc id="desc">Scene context informs a language model proposal. Author rules and world state inform Unreal Engine checks. The engine executes supported actions and records outcomes, which inform later context. This is a conceptual diagram, not evidence of a complete service loop.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a33c2c" stroke-width="1.5"/></marker></defs>
