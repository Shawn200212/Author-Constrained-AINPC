<g font-family="Arial, sans-serif" fill="#28231d">
<text x="36" y="47" font-size="24" font-weight="700">Who proposes and who acts</text>
<text x="36" y="78" font-size="17" fill="#62594e">Conceptual flow · public overview</text>
<g fill="#faf8f1" stroke="#b9aa96" stroke-width="1.5">
<rect x="36" y="212" width="245" height="120" rx="8"/>
