</g>
<text x="57" y="250" font-size="24" font-weight="700">Scene context</text>
<text x="57" y="283" font-size="19">Situation and interaction</text>
<text x="57" y="310" font-size="19">Visible world state</text>
<text x="360" y="250" font-size="24" font-weight="700">Language model</text>
<text x="360" y="283" font-size="19">Dialogue and intentions</text>
<text x="360" y="310" font-size="19">Structured action proposal</text>
<text x="701" y="250" font-size="24" font-weight="700">Unreal Engine</text>
<text x="701" y="283" font-size="19">Check supported actions</text>
<text x="701" y="310" font-size="19">Execute and record outcomes</text>
<text x="701" y="133" font-size="21" font-weight="700">Author rules and world state</text>
<text x="701" y="158" font-size="17">Constraints on execution</text>
<g fill="none" stroke="#a33c2c" stroke-width="2.5" marker-end="url(#arrow)">
